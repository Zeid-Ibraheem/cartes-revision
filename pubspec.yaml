name: cartes_revision
description: "Cartes de révision par répétition espacée (FSRS), rangées par dossiers et paquets. Sans compte, sans réseau."
publish_to: 'none'

# La version n'est écrite qu'ici. tools/release.sh la change et crée
# l'étiquette ; GitHub construit l'APK avec ce numéro.
# Première publication : tools/release.sh minor  (0.0.0 -> 0.1.0)
version: 0.8.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.3
  fsrs: ^2.0.1
  material_ui: ^1.11.0
  path: ^1.9.1
  sqflite: ^2.4.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0

# sqflite_common_ffi (base SQLite dans les tests sur PC) est ajouté par
# setup.sh avec la dernière version compatible.
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
