# Se lance quand une étiquette de version est poussée (tools/release.sh la crée),
# par exemple v0.1.0. Construit l'APK Android signé, puis le publie dans une
# Release GitHub. Obtainium, sur le téléphone, le récupère de là : pas de câble.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.5   # la même que dans ci.yml
  APP_NAME: cartes-revision # nom du fichier publié

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: SQLite pour les tests de la base
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Remettre la clé de signature (fichier temporaire, jamais commité)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Le numéro interne (versionCode) vient du compteur de GitHub : il augmente toujours.
          flutter build apk --release \
            --build-name="$V" \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=APP_VERSION="$V"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APP_NAME-$V-android.apk"

      - name: Vérifier que l'APK est signé avec LA bonne clé
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APK="dist/$APP_NAME-${GITHUB_REF_NAME#v}-android.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Empreinte du certificat : $ACTUAL"
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::La variable du dépôt ANDROID_CERT_SHA256 n'est pas réglée."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::L'APK n'est pas signé avec la clé attendue. Publication annulée."
            exit 1
          fi

      - name: Notes de version (tirées de CHANGELOG.md)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v version="[$V]" '/^## /{printing = index($0, version) > 0; next} printing' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $V" > notes.md
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publier la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Cartes $GITHUB_REF_NAME" --notes-file notes.md dist/*
